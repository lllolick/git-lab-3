<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>
    <style>
        /* Настройки фона всей страницы (плавный градиент и центрирование) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        /* Стильная белая карточка для контента */
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 90%;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        /* Эффект легкого покачивания при наведении на карточку */
        .container:hover {
            transform: translateY(-5px);
        }

        /* Красивый градиентный заголовок */
        h1 {
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            font-size: 2.5rem;
        }

        /* Стили для текста */
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
            margin: 15px 0;
        }

        /* Декоративная линия-разделитель */
        .divider {
            height: 3px;
            width: 60px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            margin: 20px auto;
            border-radius: 2px;
        }

        /* Красивый аккуратный подвал внутри карточки */
        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #aaa;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Привет, мир! DEMO</h1>
        <div class="divider"></div>
        <p>Это мой первый сайт на GitHub Pages.</p> 
        <p>Этот сайт размещён с помощью GitHub Pages.</p>
        <p>Второй абзац: проверка модификации файла1.</p>
 <footer>&copy; 2025 Мой проект</footer>
    </div>

</body>
</html>
